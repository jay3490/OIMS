    <div class="container">

        <form id="form" class="needs-validation" novalidate="novalidate" enctype="multipart/form-data">

            <input name="__RequestVerificationToken" type="hidden"

            <div class="form-horizontal">
                <hr>

                <div class="text-success" id="successmsg" style="display:none">
                    New password updated successfully.
                </div>
                <div class="text-danger" id="failemsg" style="display:none">
                    Something invalid.
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-md-2" for="OldPassword">Old Password:</label>
                <div class="col-md-4">
                    <input class="form-control text-box single-line password" data-val="true"
                        data-val-required="Old Password is required." id="OldPassword" name="OldPassword"

                    <span class="field-validation-valid text-danger" data-valmsg-for="OldPassword"
                        data-valmsg-replace="true"></span>
                </div>
            </div>

            <div class="form-group">
                <label class="control-label col-md-2" for="NewPassword">New Password:</label>
                <div class="col-md-4">
                    <input class="form-control text-box single-line password" data-val="true"
                        data-val-required="New Password is required." id="NewPassword" name="NewPassword"
                        type="password">
                    <span class="field-validation-valid text-danger" data-valmsg-for="NewPassword"

            <div class="form-group">

                    <input class="form-control text-box single-line password" data-val="true"
                        data-val-equalto="New Password doesn't match." data-val-equalto-other="*.NewPassword"

    <script>
        $('#form').submit(function (e) {
            console.log("button clicked");
            e.preventDefault();
            var $form = $(this);
            console.log($form);
            //` ;
            // check if the input is valid using a 'valid' property
            //if (!$form.valid) return false;
            var data = $form.serialize();
            console.log("data-", data);

            $.ajax({
                type: 'POST',
                url: '/Account/ChangePassword',
                data: data,
                success: function (data) {
                    ;
                    console.log(data);
                    if (data == true) {
                        $("#successmsg").show();
                        $("#failemsg").hide();
                    }
                    else if (data == false) {
                        $("#successmsg").hide();
                        $("#failemsg").show();
                        //$("#EmailId").val('');
                    }
                },
            });
        });
